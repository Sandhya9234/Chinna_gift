<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Image Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            background-image: url('envolepe.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
        h1 {
            font-size: 60px; /* Increased font size for Hi */
            color: #640404;
        }
        .content {
            text-align: center;

        }
        #letterImage {
            cursor: pointer;
            width: 200px;
            height: auto;
        }
        a {
            text-decoration: none; /* Removes the underline from the link */
            color: #0c0c0c; /* Changes text color to Tomato */
            font-size: 1.5rem; /* Increases font size */
            font-weight: bold; /* Makes the text bold */
        }
        a:hover {
            color: #0b0a0a; 
        }
    </style>
</head>
<body>
    <div class="content">
        <h1 style="font-family:'Brush Script MT', cursive;">Happy Valentine's Day</h1>
        <p><a href="third page.html">Tap here</a></p>
        
    </div>
</body>
</html>
