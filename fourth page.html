<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            background-image: url('envolepe.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
            text-align: center;
        }
        h1 {
            margin-top: 0px; /* Removed margin-top to eliminate gap */
            font-size: 2.5rem;
            color: #ece7e7;
            font-family: 'Comic Sans MS', sans-serif;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 0px;
            padding-left: 300px;
            margin-top: 0px; /* Reduced margin to zero to remove extra space */
            width: 80%;
            max-width: 1200px;
        }
        .gallery img {
            width: 100%;
            height: 250px; /* Fixes the height of all images */
            object-fit: cover; /* Ensures images maintain their aspect ratio while filling the space */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .back-link {
            margin-top: 20px;
            font-size: 1.2rem;
        }
        .back-link a {
            text-decoration: none;
            color: #0e0d0d;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Our Beautiful Moments</h1>
    <div class="gallery">
        <img src="photo1.jpg" alt="Photo 1">
        <img src="photo2.jpg" alt="Photo 2"><br>
        <img src="photo3.jpg" alt="Photo 3">
        <img src="photo4.jpg" alt="Photo 4">
        <!-- Add more images as necessary -->
    </div>
    <div class="back-link">
        <p><a href="third-page.html">Back to Love Story</a></p>
    </div>
</body>
</html>
